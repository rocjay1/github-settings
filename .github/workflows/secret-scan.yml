name: Secret scan

# Reusable gitleaks scan over the caller's full history. Call it from a job named
# "secrets" so the check reports as "secrets / secrets":
#
#   jobs:
#     secrets:
#       permissions:
#         contents: read
#         pull-requests: read
#       uses: rocjay1/github-settings/.github/workflows/secret-scan.yml@v1.0.0
#
# Pin an exact release tag (vX.Y.Z), never a branch or a floating major tag. Releases
# here are immutable, so a release tag can't be moved to another commit.

on:
  workflow_call:

permissions: {}

jobs:
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITLEAKS_ENABLE_COMMENTS: "false"
