name: Workflow lint

# Reusable actionlint + zizmor audit of the caller's workflows. Call it from a job
# named "workflows" so the check reports as "workflows / workflows":
#
#   jobs:
#     workflows:
#       permissions:
#         contents: read
#       uses: rocjay1/github-settings/.github/workflows/workflow-lint.yml@<sha> # <ref>

on:
  workflow_call:
    inputs:
      zizmor-config:
        description: >-
          Path to the zizmor config in the caller repo. When the default path is
          missing, zizmor runs with its defaults; a non-default path must exist.
        type: string
        default: .github/zizmor.yml

permissions: {}

jobs:
  workflows:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      ACTIONLINT_VERSION: 1.7.12
      ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
      ZIZMOR_VERSION: 1.30.1
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: false
      - name: Lint workflows with actionlint
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/actionlint.tar.gz"
          curl -fsSL -o "${archive}" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  ${archive}" | sha256sum --check --strict
          tar -xzf "${archive}" -C "${RUNNER_TEMP}" actionlint
          "${RUNNER_TEMP}/actionlint" -color
      - name: Audit workflows with zizmor
        env:
          GH_TOKEN: ${{ github.token }}
          ZIZMOR_CONFIG: ${{ inputs.zizmor-config }}
        run: |
          set -euo pipefail
          args=()
          if [[ -f "${ZIZMOR_CONFIG}" ]]; then
            args=(--config "${ZIZMOR_CONFIG}")
          elif [[ "${ZIZMOR_CONFIG}" != ".github/zizmor.yml" ]]; then
            echo "::error::zizmor config ${ZIZMOR_CONFIG} not found"
            exit 1
          else
            echo "::notice::No ${ZIZMOR_CONFIG}; running zizmor with its defaults"
          fi
          uvx "zizmor@${ZIZMOR_VERSION}" "${args[@]}" --format=github .
